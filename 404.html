<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found · Kalam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@400..600&display=swap">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>.back:not(.on) { opacity: 0; visibility: hidden; }</style>
</head>
<body>



<div class="page">
  
  <header class="head">
    <a class="wordmark" href="/">Kalam</a>
    
  </header>
  

  

  
    
  

  
<section class="section">
  <h2 class="lead">There's no page here.</h2>
  <p><a href="/">Back to Kalam</a></p>
</section>


  <footer class="foot">
    <p>Photographs by Narun Raman.</p>
  </footer>
</div>
<script>
// copy one line of code; the button says "copied" until the next click elsewhere
document.addEventListener("click", function (e) {
  var b = e.target.closest && e.target.closest("button.cp");
  if (!b) return;
  navigator.clipboard.writeText(b.getAttribute("data-copy")).then(function () {
    document.querySelectorAll("button.cp.done").forEach(function (x) { x.classList.remove("done"); x.textContent = "copy"; });
    b.classList.add("done"); b.textContent = "copied";
  });
});
</script>
<script>
// project pages: as the header scrolls away the photo slides left across the wordmark, and once
// the header is gone a small "back to Kalam" mark appears top left
(function () {
  var back = document.querySelector(".back"), head = document.querySelector(".head.home");
  if (!back || !head) return;
  var photo = head.querySelector(".head-photo"), word = head.querySelector(".wordmark");
  var still = window.matchMedia("(prefers-reduced-motion: reduce)");
  var queued = false;
  function update() {
    queued = false;
    var bottom = head.getBoundingClientRect().bottom, end = bottom + window.scrollY;
    var p = Math.min(1, Math.max(0, window.scrollY / end));
    photo.style.transform = still.matches ? "" : "translateX(" + (-p * word.offsetWidth).toFixed(1) + "px)";
    back.classList.toggle("on", bottom < 0);
  }
  window.addEventListener("scroll", function () { if (!queued) { queued = true; requestAnimationFrame(update); } }, { passive: true });
  window.addEventListener("resize", update);
  update();
})();
</script>

</body>
</html>
